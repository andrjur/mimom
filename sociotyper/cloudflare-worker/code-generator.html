<!doctype html><html lang="ru"><meta charset="utf-8"><title>Коды пакетов — локальный инструмент</title><style>body{font:16px system-ui;max-width:760px;margin:60px auto;padding:0 20px}button{padding:12px 18px;font-weight:700}pre{padding:18px;background:#111;color:#d8ff00;white-space:pre-wrap;word-break:break-all}label{display:block;margin:12px 0}input{padding:8px;width:100px}</style><h1>Создать код пакета</h1><p>Страница работает только в браузере. Она не отправляет данные в интернет.</p><label>Анализов <input id="a" type="number" value="10" min="1"></label><label>Вопросов <input id="q" type="number" value="30" min="0"></label><button id="go">Создать код и SQL</button><h2 id="code"></h2><pre id="sql">Нажмите кнопку</pre><script>const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');go.onclick=async()=>{const raw=crypto.getRandomValues(new Uint8Array(8));const code=[...raw].map(x=>(x%36).toString(36).toUpperCase()).join('').match(/.{1,4}/g).join('-');const normalized=code.replace(/-/g,'');const hash=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normalized)));document.querySelector('#code').textContent=code;document.querySelector('#sql').textContent=`INSERT INTO access_codes (code_hash,label,analysis_credits,question_credits) VALUES ('${hash}','ручная продажа',${+a.value},${+q.value});`;}</script></html>
