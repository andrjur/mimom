<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-labelledby="title desc"><title id="title">Разделитель смыслов</title><desc id="desc">Что прозвучало; Моя версия; Что уточнить; Ответ автора</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#52656c" stroke-width="1.5"/></marker></defs><rect width="400" height="480" rx="12" fill="#ffffff"/><rect x="24" y="92" width="48" height="6" rx="3" fill="#e7edf0"/><g font-family="Arial, sans-serif" fill="#243643"><text x="24" y="48" font-size="28" font-weight="700">Разделитель смыслов</text><line x1="200" y1="116" x2="200" y2="432" stroke="#52656c" stroke-width="2"/><rect x="22" y="130" width="166" height="128" rx="12" fill="#e7edf0" stroke="#a8b7b9" stroke-width="1.3"/><text x="105" y="186.75" text-anchor="middle" font-size="26">Что</text><text x="105" y="219.25" text-anchor="middle" font-size="26">прозвучало</text><rect x="22" y="275" width="166" height="128" rx="12" fill="#f6f7f5" stroke="#a8b7b9" stroke-width="1.3"/><text x="105" y="331.75" text-anchor="middle" font-size="26">Моя</text><text x="105" y="364.25" text-anchor="middle" font-size="26">версия</text><rect x="212" y="130" width="166" height="128" rx="12" fill="#e7edf0" stroke="#a8b7b9" stroke-width="1.3"/><text x="295" y="186.75" text-anchor="middle" font-size="26">Что</text><text x="295" y="219.25" text-anchor="middle" font-size="26">уточнить</text><rect x="212" y="275" width="166" height="128" rx="12" fill="#f6f7f5" stroke="#a8b7b9" stroke-width="1.3"/><text x="295" y="331.75" text-anchor="middle" font-size="26">Ответ</text><text x="295" y="364.25" text-anchor="middle" font-size="26">автора</text></g></svg>