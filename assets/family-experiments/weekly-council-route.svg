<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-labelledby="title desc"><title id="title">Как играть</title><desc id="desc">3 мин: проверить; 7 мин: один вопрос; 5 мин: договориться; Назначить возврат</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#52656c" stroke-width="1.5"/></marker></defs><rect width="400" height="480" rx="12" fill="#ffffff"/><rect x="24" y="92" width="48" height="6" rx="3" fill="#eee8df"/><g font-family="Arial, sans-serif" fill="#243643"><text x="24" y="48" font-size="28" font-weight="700">Как играть</text><line x1="200" y1="195" x2="200" y2="198" stroke="#52656c" stroke-width="2" marker-end="url(#arrow)"/><line x1="200" y1="279" x2="200" y2="282" stroke="#52656c" stroke-width="2" marker-end="url(#arrow)"/><line x1="200" y1="363" x2="200" y2="366" stroke="#52656c" stroke-width="2" marker-end="url(#arrow)"/><rect x="56" y="116" width="288" height="78" rx="12" fill="#f6f7f5" stroke="#a8b7b9" stroke-width="1.3"/><text x="200" y="164" text-anchor="middle" font-size="26">3 мин: проверить</text><rect x="56" y="200" width="288" height="78" rx="12" fill="#f6f7f5" stroke="#a8b7b9" stroke-width="1.3"/><text x="200" y="248" text-anchor="middle" font-size="26">7 мин: один вопрос</text><rect x="56" y="284" width="288" height="78" rx="12" fill="#f6f7f5" stroke="#a8b7b9" stroke-width="1.3"/><text x="200" y="315.75" text-anchor="middle" font-size="26">5 мин:</text><text x="200" y="348.25" text-anchor="middle" font-size="26">договориться</text><rect x="56" y="368" width="288" height="78" rx="12" fill="#eee8df" stroke="#a8b7b9" stroke-width="1.3"/><text x="200" y="416" text-anchor="middle" font-size="26">Назначить возврат</text></g></svg>