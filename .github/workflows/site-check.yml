name: Website and funnel checks
on:
  workflow_dispatch:
  push:
    paths: ['_posts/**', '_layouts/**', '_includes/**', 'articles/**', 'family-experiments/**', 'assets/**', 'tools/marketing-site/**', '_config.yml', 'index.html', '.github/workflows/site-check.yml']
  pull_request:
    paths: ['_posts/**', '_layouts/**', '_includes/**', 'articles/**', 'family-experiments/**', 'assets/**', 'tools/marketing-site/**', '_config.yml', 'index.html', '.github/workflows/site-check.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/marketing-site/package-lock.json
      - run: npm ci
        working-directory: tools/marketing-site
      - run: node tools/marketing-site/scripts/check-site.mjs
      - run: node tools/marketing-site/scripts/check-family.mjs
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: node tools/marketing-site/scripts/check-site.mjs --built _site
      - run: node tools/marketing-site/scripts/check-family.mjs --built _site
