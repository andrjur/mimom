name: Typist checks
on:
  push:
    paths: ['tools/sociotyper/**', '.github/workflows/typist-check.yml']
  pull_request:
    paths: ['tools/sociotyper/**', '.github/workflows/typist-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/sociotyper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/sociotyper/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
