                                        onClick={handlePokeMascot}
                                        className="font-bold underline hover:opacity-100"
                                    >
                                        Тыкнуть ещё раз →
                                    </button>
                                </div>
                            </div>
                        )}

                        <button
                            onClick={handlePokeMascot}
                            className="mascot-float group relative w-16 h-16 rounded-full bg-gradient-to-br from-rose-500 to-indigo-600 text-white shadow-xl shadow-rose-500/30 flex items-center justify-center text-3xl border-2 border-white/80 hover:scale-110 active:scale-95 transition-transform"
                            title="Тыкни в Скрепыша-Физика! (80% шутка / 20% подсказка)"
                        >
                            <span>📎</span>
                            <span className="absolute -top-1 -left-1 bg-amber-400 text-gray-900 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow">
                                ИИ
                            </span>
                        </button>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
